  <style>
    :root {
      --yellow: #ffe56a;
      --ink: #3a2a14;
      --button: #e07a1f;
      --button-hover: #c86612;
      --title: "Pacifico", "Segoe Script", "Comic Sans MS", cursive;
      --hand: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
      --sans: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #fff;
    }

    body {
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink);
      font-family: var(--sans);
    }

    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: clamp(6px, 1vh, 10px) clamp(12px, 2vw, 24px);
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-family: var(--title);
      font-size: clamp(1.15rem, 2.4vh, 1.6rem);
      line-height: 1;
      text-decoration: none;
    }

    .back svg {
      width: clamp(28px, 4vh, 40px);
      height: auto;
    }

    .flyer {
      display: inline-block;
      padding: clamp(6px, 0.8vh, 8px) 14px;
      background: var(--button);
      color: var(--ink);
      font-family: var(--hand);
      font-size: clamp(0.85rem, 1.8vh, 1rem);
      font-weight: 700;
      text-decoration: none;
      border: 3px solid #8d420c;
      border-radius: 999px;
      box-shadow: 0 3px 0 #8d420c;
    }

    .flyer:hover {
      background: var(--button-hover);
    }

    .back:focus-visible,
    .flyer:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 clamp(12px, 2vw, 28px) clamp(8px, 1.2vh, 16px);
    }

    .stage img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }

    @media (max-width: 640px) {
      .bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .flyer {
        align-self: stretch;
        text-align: center;
      }
    }
  </style>
